name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Dosyayı adlandır
        run: cp app/build/outputs/apk/release/app-release.apk Yapilacaklar.apk

      - name: Releases'a yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Yapılacaklar 1.0.${{ github.run_number }}
          body: Telefondan Yapilacaklar.apk dosyasını indirip kur.
          files: Yapilacaklar.apk
          make_latest: true
