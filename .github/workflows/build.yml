name: APK derle

on:
  push:
    branches: [ kafe-masraf ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Derle
        run: gradle assembleRelease --no-daemon

      - name: APK'yı hazırla
        run: cp app/build/outputs/apk/release/app-release.apk KafeMasraf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KafeMasraf
          path: KafeMasraf.apk

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kafe-masraf-apk
          target_commitish: kafe-masraf
          name: Kafe Masraf (APK)
          body: Tablete KafeMasraf.apk dosyasını indirip kurun. İnternetsiz çalışır, veriler tablette saklanır. Pusula'dan ayrıdır.
          files: KafeMasraf.apk
          make_latest: false
          overwrite_files: true
