plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kutlu.kafemasraf'
    compileSdk 34

    defaultConfig {
        applicationId 'com.kutlu.kafemasraf'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            storeFile file('kafe.keystore')
            storePassword 'kafemasraf'
            keyAlias 'kafe'
            keyPassword 'kafemasraf'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
