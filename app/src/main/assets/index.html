<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafe Masraf</title>
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1f1d1a;--mute:#6f6a62;--line:#e6e1d8;--acc:#7a4a24;--pos:#1d7a46;--neg:#b23a2b;
--s1:#257de0;--s2:#f47230;--s3:#00b894;--track:#f0ede7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--acc);color:#fff}
.topin{max-width:900px;margin:0 auto;padding:10px 14px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
.top h1{font-size:18px;margin:0}
.pdf{background:#fff;color:var(--acc);font-weight:700;border-radius:20px;padding:8px 14px;font-size:14px}
.tabs{max-width:900px;margin:0 auto;display:flex;overflow-x:auto;padding:6px 8px 0}
.tabs button{background:none;color:#f3e6da;border-radius:0;padding:10px 12px;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;font-weight:700;border-bottom-color:#fff}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{border:1px solid var(--line);border-radius:10px;padding:10px}
.p .n{font-weight:600;font-size:14px}
.p .v{font-size:18px;font-weight:700;margin-top:2px}
.p .d{font-size:12px;margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
.tot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .full{grid-column:1/-1}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.btn{background:var(--acc);color:#fff;font-weight:600}
.btn2{background:#efe9e0;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.x{background:none;color:var(--neg);padding:2px 6px;font-size:16px}
.e{background:none;color:var(--acc);padding:2px 6px;font-size:14px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.banner{background:#fff4d6;border:1px solid #ecd58f;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.status{font-size:12px;color:var(--mute);min-height:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:#fff;color:var(--ink);padding:9px 6px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;font-weight:600}
.tag.m{background:#e3eefb;color:#1a5aa3}.tag.t{background:#fde9df;color:#9a4113}.tag.d{background:#ddf5ee;color:#08705a}
.chip{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;background:#f0ede7;color:#5a554d}
.small{font-size:12px;color:var(--mute)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;margin-bottom:8px}
@media(max-width:620px){.filters{grid-template-columns:1fr 1fr}.filters .q{grid-column:1/-1}}
.filters select,.filters input{padding:8px;font-size:14px}
.sum{display:flex;justify-content:space-between;background:#faf8f4;border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:6px}
.sform{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
/* grafikler */
.stack{display:flex;gap:2px;height:22px;margin:4px 0 10px}
.stack div{height:100%}
.stack div:first-child{border-radius:4px 0 0 4px}.stack div:last-child{border-radius:0 4px 4px 0}
.stack div:only-child{border-radius:4px}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
.leg span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.hb{display:grid;grid-template-columns:minmax(90px,160px) 1fr 150px;align-items:center;gap:8px;padding:5px 4px;font-size:13px;border-radius:6px}
.hb.tap{cursor:pointer}.hb.tap:active{background:#f6f2ec}
.hb .t{height:12px;background:var(--track);border-radius:0 4px 4px 0;overflow:hidden}
.hb .t div{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.hb .v{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.hb .v small{color:var(--mute);margin-left:4px}
.mchart{width:100%;height:auto;display:block}
.mtip{font-size:13px;min-height:18px;margin-top:4px}
.empty{color:var(--mute);padding:10px 0}
</style>
</head>

function monthChart(st){var M=st.months;if(!M.length)return'<div class="empty">Tarihli kayıt yok.</div>';
  var W=640,H=230,L=8,R=8,T=22,B=30,n=M.length,max=Math.max.apply(null,M.map(function(m){return m.a}))||1;
  var bw=(W-L-R)/n,g=Math.min(14,bw*0.25),h='<svg class="mchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Aylara göre harcama">';
  h+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="#d8d2c8" stroke-width="1"/>';
  M.forEach(function(m,i){var bh=(m.a/max)*(H-T-B),x=L+i*bw+g/2,w=bw-g,y=H-B-bh,r=Math.min(4,w/2,bh);
    var d=bh>0?'M'+x+','+(H-B)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(H-B)+'Z':'';
    h+='<g class="mb" data-m="'+i+'" style="cursor:pointer"><rect x="'+(L+i*bw)+'" y="'+T+'" width="'+bw+'" height="'+(H-T)+'" fill="transparent"/>'+(d?'<path d="'+d+'" fill="#257de0"/>':'')+
      '<text x="'+(x+w/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="12" fill="#1f1d1a">'+(m.a?short(m.a):'')+'</text>'+
      '<text x="'+(x+w/2)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="#6f6a62">'+monthName(m.k,true)+'</text></g>';});
  return h+'</svg>';}

function filtered(){var P=S.partners,qq=lc(q).trim(),words=qq?qq.split(/\s+/):[];

    if(fP!=='all'&&it.p!==Number(fP))return false;if(fK!=='all'&&it.k!==fK)return false;if(fC!=='all'&&it.c!==fC)return false;

    var hay=lc([it.d,it.c,KN[it.k],P[it.p],s?s.n:'',s?s.j:'',trDate(it.t),String(it.a),fmt(it.a)].join(' '));
    return words.every(function(w){return hay.indexOf(w)>=0||hay.replace(/\./g,'').indexOf(w.replace(/\./g,''))>=0});
  }).sort(function(a,b){return (b.t||'').localeCompare(a.t||'')||b.id-a.id});}

    S.cats[i]=v;S.items.forEach(function(it){if(it.c===old)it.c=v});S.subs.forEach(function(s){if(s.cat===old)s.cat=v});if(fC===old)fC=v;save('cs');render()}});
  document.querySelectorAll('[data-cx]').forEach(function(b){b.onclick=function(){var i=Number(b.dataset.cx);S.cats.splice(i,1);save('cs');render()}});
  var nb=document.getElementById('ncatb');if(nb)nb.onclick=function(){var v=val('ncat').trim();if(!v)return;if(S.cats.indexOf(v)<0)S.cats.push(v);save('cs');render()};
  var cv=document.getElementById('cv');if(cv)cv.onclick=function(){shareFile('kafe-masraf-'+today()+'.csv','﻿'+csv(),'text/csv')};
  var bk=document.getElementById('bk');if(bk)bk.onclick=function(){shareFile('kafe-masraf-yedek-'+today()+'.json',JSON.stringify(S),'application/json');status('cs','Yedeği Drive, WhatsApp veya e-postaya kaydedin.')};
  var rs=document.getElementById('rs');if(rs)rs.onclick=function(){document.getElementById('rf').click()};
  var rf=document.getElementById('rf');if(rf)rf.onchange=function(ev){var fl=ev.target.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){
    var d;try{d=JSON.parse(rd.result)}catch(e){status('cs','Bu dosya geçerli bir yedek değil.');return}
    if(!d||!Array.isArray(d.items)||!Array.isArray(d.partners)){status('cs','Bu dosya geçerli bir yedek değil.');return}
    confirmBox('Yedekteki '+d.items.length+' kayıt yüklensin mi? Şu anki kayıtların yerine geçer.','Yükle',function(){S=d;norm();save('cs');render();status('cs','Yedek yüklendi ✓')});};rd.readAsText(fl)};
}

function csv(){var r=['Tarih;Kim;Tür;Kategori;Taşeron;Açıklama;Tutar'];S.items.slice().sort(function(a,b){return(a.t||'').localeCompare(b.t||'')}).forEach(function(it){var s=it.k==='t'?sub(it.s):null;r.push([trDate(it.t),S.partners[it.p],KN[it.k],it.c,s?s.n:'','"'+String(it.d).replace(/"/g,'""')+'"',String(it.a).replace('.',',')].join(';'))});return r.join('\n')}

function report(){var st=stats(),P=S.partners;
  return{date:trDate(today()),total:st.total,avg:st.avg,
    partners:P.map(function(n,i){return{n:n,a:st.paid[i],pct:st.total?st.paid[i]/st.total*100:0,diff:st.paid[i]-st.avg}}),
    kinds:st.kinds.map(function(x){return{n:KN[x.k],a:x.a,k:x.k}}),
    cats:st.cats,months:st.months.map(function(m){return{n:monthName(m.k),a:m.a}}),nodate:st.nodate,
    subs:S.subs.map(function(s){return{n:s.n,j:s.j||'',c:Number(s.c)||0,p:paidTo(s.id)}}).sort(function(a,b){return b.p-a.p}),
    items:S.items.slice().sort(function(a,b){return(a.t||'').localeCompare(b.t||'')||a.id-b.id}).map(function(it){var s=it.k==='t'?sub(it.s):null;return{t:trDate(it.t),p:P[it.p],k:KN[it.k],c:it.c,d:(s?s.n+(it.d?' – ':''):'')+(it.d||''),a:it.a}})};}
function sendPdf(){
  if(window.Android&&Android.sharePdf){status('gst','PDF hazırlanıyor…');Android.sharePdf(JSON.stringify(report()),'Kafe_Masraf_Ozet_'+today()+'.pdf');setTimeout(function(){status('gst','')},3000);return}
  status('gst','PDF yalnızca tablet uygulamasında oluşturulur.');}
function shareFile(n,c,m){try{if(window.Android){Android.shareFile(n,c,m);return}}catch(e){}status('cs','Paylaşım yalnızca uygulamada çalışır.')}

function save(sid){
  try{if(window.Android){Android.save(JSON.stringify(S));status(sid,'Kaydedildi ✓');return}}catch(e){status(sid,'Kaydedilemedi!');return}
  try{localStorage.setItem(LS,JSON.stringify(S));status(sid,'Kaydedildi ✓')}catch(e){status(sid,'Kaydedilemedi!')}
}
window.__kafe={S:function(){return S},report:report};
render();
})();
</script>
