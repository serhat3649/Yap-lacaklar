<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafe Ortaklık Masraf Takibi</title>
<style id="css">
:root{--bg:#f6f4f0;--card:#fff;--ink:#1f1d1a;--mute:#6f6a62;--line:#e6e1d8;--acc:#7a4a24;--pos:#1d7a46;--neg:#b23a2b;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{border:1px solid var(--line);border-radius:10px;padding:10px}
.p .n{font-weight:600;font-size:14px}
.p .v{font-size:18px;font-weight:700;margin-top:2px}
.p .d{font-size:12px;margin-top:2px}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mute{color:var(--mute)}
.tot{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 14px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form .full{grid-column:1/-1}
label{font-size:12px;color:var(--mute);display:block;margin-bottom:3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
button{font:inherit;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
.btn{background:var(--acc);color:#fff;font-weight:600}
.btn2{background:#efe9e0;color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600}
td.r,th.r{text-align:right;white-space:nowrap}
.x{background:none;color:var(--neg);padding:2px 6px;font-size:16px}
.e{background:none;color:var(--acc);padding:2px 6px;font-size:14px}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.banner{background:#fff4d6;border:1px solid #ecd58f;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.status{font-size:12px;color:var(--mute);min-height:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:#fff;color:var(--ink);padding:9px 6px}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-right:4px;font-weight:600}
.tag.m{background:#e7f0ea;color:#1d5e3a}.tag.t{background:#f3e6da;color:#7a4a24}.tag.d{background:#e8e8ef;color:#44465a}
.small{font-size:12px;color:var(--mute)}
.filters{display:flex;gap:6px}
.filters select{width:auto;max-width:150px;padding:6px 8px;font-size:13px}
.sform{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
</style>
</head>

  // Ayarlar
  h+='<div class="card"><h2>Ortaklar ve dışa aktarma</h2>';
  if(!readOnly){h+='<div class="grid">'+P.map(function(n,i){return'<div><label>Ortak '+(i+1)+'</label><input data-n="'+i+'" value="'+esc(n)+'"></div>'}).join('')+'</div>';}
  h+='<div class="row" style="margin-top:10px"><button class="btn2" id="cp">Özeti paylaş (WhatsApp)</button><button class="btn2" id="cv">Excel (CSV) paylaş</button></div><div class="row" style="margin-top:8px"><button class="btn2" id="bk">Yedek al</button><button class="btn2" id="rs">Yedekten yükle</button><input type="file" id="rf" accept=".json,application/json,text/plain,*/*" style="display:none"></div><div class="status" id="cs"></div></div>';
  h+='</div>';
  document.getElementById('root').innerHTML=h;
  bind();
}

function status(id,t){var e=document.getElementById(id);if(e)e.textContent=t}
function confirmBox(msg,yes){var box=document.getElementById('del');
  box.innerHTML='<div class="banner">'+msg+' <button class="btn" id="dy" style="padding:5px 10px;margin-left:6px">Sil</button> <button class="btn2" id="dn" style="padding:5px 10px">Vazgeç</button></div>';
  box.scrollIntoView({behavior:'smooth',block:'center'});
  document.getElementById('dy').onclick=yes;document.getElementById('dn').onclick=function(){box.innerHTML=''};}

function bind(){
  document.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){
    var keep={p:val('fp'),a:val('fa'),d:val('fd'),t:val('ft')};kind=b.dataset.k;
    if(editId!=null){var it=S.items.find(function(x){return x.id===editId});it._k=kind}
    renderKeep(keep);}});
  var f=document.getElementById('f');
  if(f)f.addEventListener('submit',function(ev){ev.preventDefault();
    var a=num(val('fa'));
    if(!(a>0)){status('st','Geçerli bir tutar girin.');return}
    var rec={k:kind,p:Number(val('fp')),a:Math.round(a*100)/100,d:val('fd').trim(),t:val('ft')||today()};
    if(kind==='t'){if(!S.subs.length){status('st','Önce bir taşeron ekleyin.');return}rec.s=Number(val('fs'))}
    if(editId!=null){var it=S.items.find(function(x){return x.id===editId});delete it._k;delete it.s;Object.assign(it,rec);editId=null}
    else{rec.id=S.seq++;S.items.push(rec)}
    var keepP=rec.p,keepS=rec.s;render();var sel=document.getElementById('fp');if(sel)sel.value=keepP;var ss=document.getElementById('fs');if(ss&&keepS!=null)ss.value=keepS;save('st');});
  var fc=document.getElementById('fc');if(fc)fc.onclick=function(){editId=null;render()};
  document.querySelectorAll('[data-x]').forEach(function(b){b.onclick=function(){
    var id=Number(b.dataset.x),it=S.items.find(function(x){return x.id===id});
    confirmBox('“'+esc(it.d||KN[it.k])+'” ('+fmt(it.a)+') silinsin mi?',function(){S.items=S.items.filter(function(x){return x.id!==id});render();save('st')});}});
  document.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){editId=Number(b.dataset.e);render();document.getElementById('f').scrollIntoView({behavior:'smooth'})}});
  var fl=document.getElementById('flt');if(fl)fl.onchange=function(){fP=fl.value;render()};
  var fk=document.getElementById('flk');if(fk)fk.onchange=function(){fK=fk.value;render()};
  // taşeron
  var sa=document.getElementById('sAdd');if(sa)sa.onclick=function(){showSubForm=true;editSub=null;render();var n=document.getElementById('sn');if(n)n.focus()};
  var s0=document.getElementById('sc0');if(s0)s0.onclick=function(){showSubForm=false;editSub=null;render()};
  var sf=document.getElementById('sf');
  if(sf)sf.addEventListener('submit',function(ev){ev.preventDefault();
    var n=val('sn').trim();if(!n){status('sst','Taşeron adını girin.');return}
    var c=num(val('sc'));c=c>0?Math.round(c*100)/100:0;
    var rec={n:n,j:val('sj').trim(),c:c};
    if(editSub!=null)Object.assign(sub(editSub),rec);else{rec.id=S.seq++;S.subs.push(rec)}
    editSub=null;showSubForm=false;render();save('sst');});
  document.querySelectorAll('[data-se]').forEach(function(b){b.onclick=function(){editSub=Number(b.dataset.se);showSubForm=false;render()}});
  document.querySelectorAll('[data-sx]').forEach(function(b){b.onclick=function(){
    var id=Number(b.dataset.sx);
    if(S.items.some(function(i){return i.k==='t'&&i.s===id})){status('sst','Bu taşerona ait ödemeler var; önce o ödemeleri silin veya düzenleyin.');return}
    confirmBox('“'+esc(sub(id).n)+'” taşeronu silinsin mi?',function(){S.subs=S.subs.filter(function(s){return s.id!==id});render();save('sst')});}});
  document.querySelectorAll('[data-n]').forEach(function(inp){inp.onchange=function(){var v=inp.value.trim()||('Ortak '+(Number(inp.dataset.n)+1));S.partners[Number(inp.dataset.n)]=v;render();save('cs')}});
  document.getElementById('cp').onclick=function(){shareText(textReport())};
  document.getElementById('cv').onclick=function(){shareFile('kafe-masraf-'+today()+'.csv','\ufeff'+csv(),'text/csv')};
  document.getElementById('bk').onclick=function(){shareFile('kafe-masraf-yedek-'+today()+'.json',JSON.stringify(S),'application/json');status('cs','Yedeği Drive, WhatsApp veya e-postaya kaydedin.')};
  document.getElementById('rs').onclick=function(){document.getElementById('rf').click()};
  document.getElementById('rf').onchange=function(ev){var f=ev.target.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){
    var d;try{d=JSON.parse(rd.result)}catch(e){status('cs','Bu dosya geçerli bir yedek değil.');return}
    if(!d||!Array.isArray(d.items)||!Array.isArray(d.partners)){status('cs','Bu dosya geçerli bir yedek değil.');return}
    confirmBox('Yedekteki '+d.items.length+' kayıt yüklensin mi? Şu anki kayıtların yerine geçer.',function(){S=d;norm();render();save('cs');status('cs','Yedek yüklendi ✓')});
    document.getElementById('dy').textContent='Yükle';};rd.readAsText(f)};
}
function val(id){var e=document.getElementById(id);return e?e.value:''}
function renderKeep(k){render();['fp','fa','fd','ft'].forEach(function(id,i){var e=document.getElementById(id);var v=[k.p,k.a,k.d,k.t][i];if(e&&v!=='')e.value=v})}

function textReport(){var P=S.partners,t='KAFE MASRAF ÖZETİ\n\n';
  var paid=P.map(function(){return 0});S.items.forEach(function(it){paid[it.p]+=Number(it.a)||0});
  P.forEach(function(n,i){t+=n+': '+fmt(paid[i])+'\n'});
  var tot=paid.reduce(function(a,b){return a+b},0);
  t+='\nToplam: '+fmt(tot)+'\nMalzeme: '+fmt(sumKind('m'))+'\nTaşeron: '+fmt(sumKind('t'))+'\nDiğer: '+fmt(sumKind('d'))+'\nKişi başı: '+fmt(tot/P.length)+'\n';
  if(S.subs.length){t+='\nTAŞERONLAR (anlaşma / ödenen / kalan)\n';
    S.subs.forEach(function(s){var pd=paidTo(s.id);t+='- '+s.n+(s.j?' ('+s.j+')':'')+': '+(s.c?fmt(s.c):'—')+' / '+fmt(pd)+' / '+(s.c?fmt(s.c-pd):'—')+'\n'});}
  return t;}
function csv(){var r=['Tarih;Kim;Tür;Taşeron;Açıklama;Tutar'];S.items.slice().sort(function(a,b){return(a.t||'').localeCompare(b.t||'')}).forEach(function(it){var s=it.k==='t'?sub(it.s):null;r.push([trDate(it.t),S.partners[it.p],KN[it.k],s?s.n:'','"'+String(it.d).replace(/"/g,'""')+'"',String(it.a).replace('.',',')].join(';'))});return r.join('\n')}
function shareText(t){try{if(window.Android){Android.shareText(t);return}}catch(e){}copy(t,'Özet kopyalandı.')}
function shareFile(n,c,m){try{if(window.Android){Android.shareFile(n,c,m);return}}catch(e){}copy(c,'Kopyalandı.')}
function copy(t,msg){try{navigator.clipboard.writeText(t).then(function(){status('cs',msg)},function(){status('cs','Kopyalanamadı.')})}catch(e){status('cs','Kopyalanamadı.')}}

function build(){
  var clean=JSON.parse(JSON.stringify(S));clean.items.forEach(function(i){delete i._k});
  var json=JSON.stringify(clean).replace(/</g,'\\u003c');
  return '<!DOCTYPE html>\n<html lang="tr">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>Kafe Ortaklık Masraf Takibi</title>\n<style id="css">'+CSS+'</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="state">'+json+'<\/script>\n<script id="app">'+APP+'<\/script>\n</body>\n</html>\n';
}

function save(sid){
  try{if(window.Android){Android.save(JSON.stringify(S));status(sid,'Kaydedildi ✓');return}}catch(e){status(sid,'Kaydedilemedi!');return}
  try{localStorage.setItem(LS,JSON.stringify(S));status(sid,'Kaydedildi ✓')}catch(e){status(sid,'Kaydedilemedi!')}
}

if(!window.Android){try{var l=localStorage.getItem(LS);if(l){S=JSON.parse(l)}}catch(e){}}
norm();
render();
})();
</script>
</body>
</html>
